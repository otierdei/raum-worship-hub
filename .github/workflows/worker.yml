name: Deploy Raum Hub worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency: raumhub-worker-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Am iPhone eingefügte Secrets haben oft Zusatzzeilen. Nur das erste Token Wort und die erste 32 stellige Konto ID nehmen; nur Längen ausgeben.
      - name: Clean credentials
        run: |
          tok=$(printf '%s' "$RAW_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)
          acc=$(printf '%s' "$RAW_ACCOUNT" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          echo "token found: ${#tok} chars; account id found: ${#acc} chars"
          test -n "$tok" && test -n "$acc"
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$acc" >> "$GITHUB_ENV"
          curl -fsS -H "Authorization: Bearer $tok" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -q '"status":"active"' && echo "token verified: active"

      - name: Syntax check
        run: node --check --input-type=module < worker.js && echo "syntax ok"

      - name: Deploy
        run: $WRANGLER deploy 2>&1 | tee deploy.log

      - name: Smoke test (GET ping)
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "worker url: $url"
          test -n "$url"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url" | tee ping.json | grep -q '"service":"raum-worship-hub"'; then echo "ping ok"; exit 0; fi
            sleep 5
          done
          cat ping.json || true
          exit 1
