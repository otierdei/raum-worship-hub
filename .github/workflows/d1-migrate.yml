name: D1 Migration (Spalte tasks.note)
on:
  push:
    branches: [main]
    paths: [".github/workflows/d1-migrate.yml"]
  workflow_dispatch:

concurrency: raumhub-worker-deploy

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clean credentials
        run: |
          tok=$(printf '%s' "$RAW_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)
          acc=$(printf '%s' "$RAW_ACCOUNT" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          test -n "$tok" && test -n "$acc"
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$acc" >> "$GITHUB_ENV"
      # Wiederherstellungspunkt vor der Änderung (D1 Time Travel, 30 Tage)
      - name: Restore point
        run: $WRANGLER d1 time-travel info raumhub
      - name: Add column if missing
        run: |
          has=$($WRANGLER d1 execute raumhub --remote --json --command "SELECT count(*) AS n FROM pragma_table_info('tasks') WHERE name='note'" | grep -oE '"n": *[0-9]+' | grep -oE '[0-9]+$')
          echo "note column present: $has"
          if [ "$has" = "0" ]; then $WRANGLER d1 execute raumhub --remote --command 'ALTER TABLE "tasks" ADD COLUMN "note" TEXT'; fi
      - name: Verify
        run: |
          $WRANGLER d1 execute raumhub --remote --json --command "SELECT name FROM pragma_table_info('tasks')" | grep -oE '"name": *"[a-z_]+"' | tr '\n' ' '
          $WRANGLER d1 execute raumhub --remote --json --command "SELECT count(*) AS tasks FROM tasks" | grep -oE '"tasks": *[0-9]+'
          $WRANGLER d1 execute raumhub --remote --json --command "SELECT count(*) AS n FROM pragma_table_info('tasks') WHERE name='note'" | grep -qE '"n": *1' && echo "MIGRATION OK"
