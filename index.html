<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raum Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4262b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raum Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: laptop = fixed sidebar + wide content (song board as columns); phone = one column + bottom navigation. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --line:#d6d9d3;
  --fg:#1b1c1e; --muted:#5f6266; --accent:#c4262b; --accent-soft:#f7dedd; --on-accent:#ffffff; --brand:#c4262b;
  --ok:#2f7a4a; --ok-soft:#dcefe2; --warn:#a86a12; --warn-soft:#f6e8cf; --bad:#8e1f5c; --bad-soft:#f3dbe8;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1b1c1f; --sunk:#25262a; --line:#34353a;
  --fg:#ecebea; --muted:#a09ea0; --accent:#f06a68; --accent-soft:#3a1d1e; --on-accent:#1a0b0b; --brand:#c4262b;
  --ok:#6cc08a; --ok-soft:#1c3324; --warn:#e0a54a; --warn-soft:#3a2d16; --bad:#e783b8; --bad-soft:#3a1a2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1b1c1f; --sunk:#25262a; --line:#34353a;
  --fg:#ecebea; --muted:#a09ea0; --accent:#f06a68; --accent-soft:#3a1d1e; --on-accent:#1a0b0b; --brand:#c4262b;
  --ok:#6cc08a; --ok-soft:#1c3324; --warn:#e0a54a; --warn-soft:#3a2d16; --bad:#e783b8; --bad-soft:#3a1a2c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.mono{font-family:var(--mono);font-size:.82em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 .8rem var(--display);letter-spacing:.04em}
.brand b{font-family:var(--display);font-size:1.05rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav .badge{margin-left:auto}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{min-width:0;padding-inline:28px;padding-block:18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.proto{font-size:.75rem;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px}

.bottom{display:none}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2{margin-bottom:12px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;display:inline-grid;place-items:center;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:3px 9px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
a{color:var(--accent)}

.next{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.date{width:66px;text-align:center;border-radius:10px;background:var(--accent);color:var(--on-accent);padding:8px 0}
.date b{display:block;font:700 1.7rem/1 var(--display)} .date span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.rsvp{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rsvp button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
.rsvp button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.stagebar{display:flex;flex-direction:column;gap:7px}
.sb{display:grid;grid-template-columns:120px 1fr 24px;gap:10px;align-items:center;font-size:.88rem}
.sb .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.sb .fill{height:100%;background:var(--accent);border-radius:5px}
.sb .n{text-align:right}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 208px;background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.col h3{font-size:.85rem;display:flex;justify-content:space-between}
.card{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;display:block}
.card .m{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.prog{height:4px;background:var(--sunk);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.glist{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.check.prog{border-color:var(--warn);background:var(--warn-soft)}
.check svg{width:14px;height:14px;stroke:currentColor;stroke-width:3;fill:none}
.struck{text-decoration:line-through;color:var(--muted)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,16,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:20px 22px 40px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;flex:none}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fact b{display:block;font-family:var(--mono);font-size:.95rem;overflow-wrap:anywhere}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:.78rem}
.steps button.past{background:var(--accent-soft);border-color:transparent}
.steps button.now{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.note{font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.log{font-size:.78rem;color:var(--muted)}
.money{font:700 2rem var(--display);font-variant-numeric:tabular-nums}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.8rem;flex:none}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
#gate[hidden]{display:none}
.gatebox{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.gatebox .mark{width:56px;height:56px;font-size:1.2rem}
.codein{font:700 1.6rem var(--mono);letter-spacing:.3em;text-align:center}
/* Area colors: one hue per area, all at the same OKLCH lightness and moderate chroma, generated by tools/palette.py.
   Hues come from the Raum Worship Instagram look: brand red, stage indigo, tungsten amber, wine red, night blue, sage. */
[data-area="dashboard"], :root{--area:#a83630;--area-soft:#feeae7;--area-line:#f2a89e;--area-glow:#fea19647}
[data-area="songs"]{--area:#725195;--area-soft:#f3ebfe;--area-line:#c7b4e0;--area-glow:#ccaef147}
[data-area="tasks"]{--area:#934e1e;--area-soft:#ffebdf;--area-line:#e1b297;--area-glow:#f1ac8247}
[data-area="sessions"]{--area:#964557;--area-soft:#fee9ec;--area-line:#e4adb6;--area-glow:#f5a3b147}
[data-area="projects"]{--area:#0269a0;--area-soft:#e2f2fe;--area-line:#95c4e9;--area-glow:#7cc6fd47}
[data-area="ideas"]{--area:#3e7232;--area-soft:#e5f5e1;--area-line:#a8c9a0;--area-glow:#9cce9147}
[data-area="leitung"]{--area:#786101;--area-soft:#f7efd6;--area-line:#cebd88;--area-glow:#d7bc6847}
[data-area="prayer"]{--area:#4c6585;--area-soft:#e8f0fb;--area-line:#afbfd5;--area-glow:#a7c0e147}
[data-area="neutral"]{--area:#6e6055;--area-soft:#f3eeea;--area-line:#c5bcb4;--area-glow:#c9bbb047}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-area="dashboard"], :root:not([data-theme="light"]){--area:#fe9c91;--area-soft:#2c1816;--area-line:#743a34;--area-glow:#9c1b1b6b}:root:not([data-theme="light"]) [data-area="songs"]{--area:#c8aceb;--area-soft:#211b27;--area-line:#554568;--area-glow:#65418a6b}:root:not([data-theme="light"]) [data-area="tasks"]{--area:#ebaa82;--area-soft:#271b13;--area-line:#67432d;--area-glow:#853f016b}:root:not([data-theme="light"]) [data-area="sessions"]{--area:#efa2af;--area-soft:#28191c;--area-line:#693f47;--area-glow:#8a32486b}:root:not([data-theme="light"]) [data-area="projects"]{--area:#7dc3f7;--area-soft:#13202a;--area-line:#29516e;--area-glow:#025b8a6b}:root:not([data-theme="light"]) [data-area="ideas"]{--area:#9bca90;--area-soft:#182116;--area-line:#3b5535;--area-glow:#2a651c6b}:root:not([data-theme="light"]) [data-area="leitung"]{--area:#d2b96b;--area-soft:#231e0f;--area-line:#5a4c1e;--area-glow:#6853006b}:root:not([data-theme="light"]) [data-area="prayer"]{--area:#a5bddb;--area-soft:#1a1e24;--area-line:#414e5f;--area-glow:#3c57796b}:root:not([data-theme="light"]) [data-area="neutral"]{--area:#c5b8ad;--area-soft:#201d1c;--area-line:#534b46;--area-glow:#6152466b}}
:root[data-theme="dark"] [data-area="dashboard"], :root[data-theme="dark"]{--area:#fe9c91;--area-soft:#2c1816;--area-line:#743a34;--area-glow:#9c1b1b6b}
:root[data-theme="dark"] [data-area="songs"]{--area:#c8aceb;--area-soft:#211b27;--area-line:#554568;--area-glow:#65418a6b}
:root[data-theme="dark"] [data-area="tasks"]{--area:#ebaa82;--area-soft:#271b13;--area-line:#67432d;--area-glow:#853f016b}
:root[data-theme="dark"] [data-area="sessions"]{--area:#efa2af;--area-soft:#28191c;--area-line:#693f47;--area-glow:#8a32486b}
:root[data-theme="dark"] [data-area="projects"]{--area:#7dc3f7;--area-soft:#13202a;--area-line:#29516e;--area-glow:#025b8a6b}
:root[data-theme="dark"] [data-area="ideas"]{--area:#9bca90;--area-soft:#182116;--area-line:#3b5535;--area-glow:#2a651c6b}
:root[data-theme="dark"] [data-area="leitung"]{--area:#d2b96b;--area-soft:#231e0f;--area-line:#5a4c1e;--area-glow:#6853006b}
:root[data-theme="dark"] [data-area="prayer"]{--area:#a5bddb;--area-soft:#1a1e24;--area-line:#414e5f;--area-glow:#3c57796b}
:root[data-theme="dark"] [data-area="neutral"]{--area:#c5b8ad;--area-soft:#201d1c;--area-line:#534b46;--area-glow:#6152466b}
main{background-image:radial-gradient(75% 340px at 18% -60px,var(--area-glow),transparent 75%);background-repeat:no-repeat}
#title{display:flex;align-items:center;gap:10px}
#title::before{content:"";width:6px;height:1.05em;border-radius:3px;background:var(--area);flex:none}
.nav button .ico{color:var(--area)}
.nav button[aria-current="page"][data-area]{background:var(--area-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--area)}
.bottom button[aria-current="page"][data-area]{color:var(--area)}
.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--area)}
#view .panel{border-top:2px solid var(--area-line)}
#view .panel[data-area]{border-top:3px solid var(--area)}
#view .panel[data-area] .panel-head .link{color:var(--area)}
.sheet{box-shadow:inset 0 4px 0 var(--area);background-image:radial-gradient(80% 220px at 50% -60px,var(--area-glow),transparent 75%);background-repeat:no-repeat}
.prog i{background:var(--area)}
body[data-area="sessions"] #view .date,#view .panel[data-area] .date{background:var(--area);color:var(--on-area)}
:root{--on-area:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--on-area:#16171a}}
:root[data-theme="dark"]{--on-area:#16171a}
@media (max-width:760px){input,select,textarea{font-size:16px}}
html,body{margin:0}
#view .panel{background:var(--area-soft)}
h2.ctoggle{cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;-webkit-user-select:none}
h2.ctoggle::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:none}
.panel.collapsed h2.ctoggle::after{transform:rotate(-45deg)}
.panel.collapsed>:not(.panel-head):not(h2){display:none}
.panel.collapsed>.panel-head,.panel.collapsed>h2{margin-bottom:0}
.panel.collapsed{align-self:start}
.card .chip.rel{background:var(--area-soft);color:var(--area)}
.reldate{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px;font-size:.85rem}
.stagehead{font-size:1.35rem;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.stagehead::before{content:"";width:5px;height:1.05em;border-radius:3px;background:var(--area);flex:none}
.stagehead .cnt{font:600 .8rem var(--mono);background:var(--area-soft);color:var(--area);border-radius:999px;padding:2px 9px}
@media (max-width:760px){
#view .row:has([data-act="invite"]),#view .row:has([data-act="openMember"]){flex-wrap:wrap;row-gap:8px}
#view .row:has([data-act="openMember"]){padding-left:40px}
#view .row:has([data-act="openMember"]) .avatar{margin-left:-40px}
#view .row:has([data-act="openMember"]) .grow{flex:1 1 calc(100% - 12px)}
}
.skills{font-size:.78rem;color:var(--muted);margin-top:2px}
.vtext{margin:0 0 10px;line-height:1.6;max-width:70ch}
.vlist{margin:0;padding-left:20px;line-height:1.6}.vlist li{margin:4px 0}
.vkey{font-weight:600;min-width:110px;flex:none}
img.avatar{object-fit:cover;padding:0}
.avatar.big{width:72px;height:72px;font-size:1.3rem}
img.avatar[data-act]{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,8,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out}
.lightbox img{width:min(86vw,460px);height:min(86vw,460px);border-radius:18px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .lbname{color:#fff;font:600 1.1rem var(--display)}
.stream{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.stream .chip{text-decoration:none;font-weight:600}
.stream .st-apple{background:#d60017;color:#fff}.stream .st-spotify{background:#1db954;color:#06210f}.stream .st-youtube{background:#cc0000;color:#fff}
.streamedit{margin:0 0 10px;font-size:.85rem}.streamedit summary{cursor:pointer;color:var(--muted)}
.streamedit label{display:block;margin-top:8px}.streamedit input{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.protokoll textarea{width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.5}
.protokoll h3{margin-bottom:8px}
.attgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.attchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.85rem;cursor:pointer}
.attchip:has(input:checked){background:var(--area-soft);border-color:var(--area);color:var(--fg)}
.pg-row,.pt-row{display:grid;gap:6px;margin-bottom:8px;grid-template-columns:1.1fr 1.3fr .9fr 1.4fr}
.pt-row{grid-template-columns:1fr 2fr 1fr}
.pg-row input,.pg-row select,.pt-row input,.pt-row select{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
@media (max-width:760px){.pg-row{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px solid var(--line)}.pt-row{grid-template-columns:1fr 1fr}.pt-row .pt-title{grid-column:1/-1;order:-1}}
/* session sheet on laptops: centered and large instead of a side panel */
@media (min-width:900px){
  .sheet-bg:has(.sheet.wide){justify-content:center;align-items:center;padding:3vh 3vw}

function cached(){try{const c=JSON.parse(LS.get("rw-data")||"null");return c&&c.me&&c.me.id===LS.get("rw-member")?c:null}catch(e){return null}}
function forget(){LS.del("rw-token");LS.del("rw-data");try{Object.keys(localStorage).filter(k=>k.startsWith("rw-proto-")).forEach(k=>localStorage.removeItem(k))}catch(e){}D=null}
async function boot(){
  if(LS.get("rw-token")&&!D){const c=cached();if(c){D=c;S.me=D.me.id}}
  render();
  if(!LS.get("rw-token"))return;
  if(D){refresh(true);return}
  try{D=await api("bootstrap");S.me=D.me.id;render()}
  catch(e){if(e.code==="auth"){forget();render()}else{const g=document.getElementById("gate");g.innerHTML=`<div class="gatebox"><div class="mark">R</div><p>${t("offline")}</p><button class="btn" type="button" onclick="boot()">↻</button></div>`}}
}
async function refresh(force){
  if(!LS.get("rw-token")||document.hidden||S.busy||!force&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  try{const d=await api("bootstrap");if(S.busy)return;D=d;S.me=D.me.id;render()}catch(e){if(e.code==="auth"){forget();render()}}
}
setInterval(refresh,45000);

const cyc=v=>v==="open"?"prog":v==="prog"?"done":"open";

function put(list,obj){const i=list.findIndex(x=>x.id===obj.id);if(i<0)list.push(obj);else list[i]=obj}
async function run(fn,local){
  S.busy=true;
  if(local){try{local();render()}catch(_){}}
  try{await fn();render()}
  catch(e){toast(t("errSave")+": "+e.message);if(e.code==="auth"){forget()}else{try{D=await api("bootstrap")}catch(_){}}render()}

const saveSession=s=>{const base=sess(s.id)&&sess(s.id).updated_at;return run(async()=>put(D.sessions,await api("saveSession",{session:s,base})),()=>put(D.sessions,clone(s)))};

/* ---------- collapsible panels (remembered per device) ----------
   On the phone every page opens with only its first card expanded; the person's own choice per card always wins. */
const COLL=(()=>{try{return JSON.parse(LS.get("rw-collapse")||"{}")||{}}catch(e){return {}}})();
const isPhone=()=>!!(window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
function applyCollapse(){
  const phone=isPhone();
  document.querySelectorAll("#view .panel").forEach((p,i)=>{
    const h=p.querySelector(":scope>.panel-head>h2, :scope>h2");if(!h)return;
    const key=S.view+":"+h.textContent.trim();p.dataset.ckey=key;
    const c=key in COLL?COLL[key]:(phone&&i>0);p.classList.toggle("collapsed",c);
    h.setAttribute("role","button");h.tabIndex=0;h.setAttribute("aria-expanded",String(!c));h.classList.add("ctoggle");
  });
}
function toggleCollapse(h){const p=h.closest(".panel");if(!p||!p.dataset.ckey)return;
  COLL[p.dataset.ckey]=!p.classList.contains("collapsed");LS.set("rw-collapse",JSON.stringify(COLL));applyCollapse()}

  switch(f.dataset.form){
  case "login":{const err=document.getElementById("loginErr");err.textContent="";
    api("login",{member:fd.get("member"),code:fd.get("code")}).then(r=>{LS.set("rw-token",r.token);LS.set("rw-member",fd.get("member"));D=r.data;S.me=D.me.id;render()}).catch(x=>{err.textContent=x.message});return}
  case "taskTitle":{const ti=String(fd.get("title")||"").trim();const c=clone(task(id));if(!ti||c.title===ti)return;c.title=ti;saveTask(c);toast(t("saved"));return}
  case "meeting":{const ex=id?clone(sess(id)):null,kind=ex?(ex.kind||""):String(fd.get("kind")||""),date=String(fd.get("date")||""),title=String(fd.get("title")||"").trim(),inv=fd.getAll("inv");if(!date)return;
    if(kind==="gruppe"&&!title){toast(S.lang==="de"?"Gib dem Treffen einen Namen.":"Give the meeting a name.");return}
    if(kind==="gruppe"&&!inv.length){toast(S.lang==="de"?"Lade mindestens eine Person ein.":"Invite at least one person.");return}
    const s=ex||{id:(kind==="leitung"?"l":kind==="gruppe"?"g":"s")+date.replace(/-/g,"")+"_"+Date.now().toString(36).slice(-5),kind,agenda:"",results:[],decisions:[],attendees:[],rsvp:{},links:[]};
    Object.assign(s,{date,time:String(fd.get("time")||"").trim(),place:String(fd.get("place")||"").trim(),title:kind==="gruppe"?title:"",invited:kind==="gruppe"?inv:[]});
    S.sheet={type:"session",id:s.id};saveSession(s);toast(t("saved"));return}
  case "task":{const l=fd.get("link");const tk={id:"t"+Date.now(),title:fd.get("title"),owners:[fd.get("owner")],due:fd.get("due")||"",status:"open",prio:fd.get("prio"),link:l?{type:l.split(":")[0],id:l.split(":")[1]}:null,subs:[],comments:[],links:[]};S.sheet=null;saveTask(tk);return}
  case "sub":{const v=(fd.get("t")||"").trim();if(!v)return;const c=clone(task(id));c.subs.push({t:v,d:false});saveTask(c);return}
  case "comment":{const v=(fd.get("text")||"").trim();if(!v)return;run(async()=>put(D.tasks,await api("commentTask",{id,text:v})));return}
  case "writers":{const raw=(fd.get("w")||"").split(",").map(x=>x.trim()).filter(Boolean);const ids=raw.map(n=>{const m=D.members.find(x=>x.name.toLowerCase()===n.toLowerCase());return m?m.id:n});songOp(id,"writers",{writers:ids});return}
  case "prayer":{const tx=String(fd.get("text")||"").trim();if(!tx)return;run(async()=>{const r=await api("addPrayer",{kind:fd.get("kind"),text:tx,ref:fd.get("ref")||""});D.prayer=[r].concat(D.prayer||[]);toast(S.lang==="de"?"Geteilt 🙏":"Shared 🙏")});return}
  case "commentP":{const tx=String(fd.get("text")||"").trim();if(!tx)return;run(async()=>put(D.prayer,await api("commentPrayer",{id,text:tx})));return}
  case "quickTodo":{const ti=String(fd.get("title")||"").trim();if(!ti)return;saveTask({id:"t"+Date.now(),title:ti,owners:[S.me],due:"",status:"open",prio:"mid",link:{type:"project",id},subs:[],comments:[],links:[]});return}
  case "protocol":{const s=sess(id);const f2=e.target.closest("form");
    const groups=[...f2.querySelectorAll(".pg-row")].map(r=>({t:r.querySelector(".pg-t").value.trim(),who:r.querySelector(".pg-who").value.trim(),status:r.querySelector(".pg-st").value,note:r.querySelector(".pg-note").value.trim()})).filter(g=>g.t);
    const newTasks=[...f2.querySelectorAll(".pt-row")].map(r=>({owners:r.querySelector(".pt-who").value?[r.querySelector(".pt-who").value]:[],title:r.querySelector(".pt-title").value.trim(),due:r.querySelector(".pt-due").value})).filter(x=>x.title);
    run(async()=>{const r=await api("saveProtocol",{id,base:s.updated_at,agenda:fd.get("agenda")||"",attendees:fd.getAll("att"),proto:{writer:fd.get("writer"),info:fd.get("info")||"",review:fd.get("review")||"",groups},newTasks});put(D.sessions,r.session);r.tasks.forEach(x=>put(D.tasks,x));LS.del("rw-proto-"+id);toast(r.tasks.length?(t("saved")+" · "+r.tasks.length+(S.lang==="de"?" Aufgaben angelegt":" tasks created")):t("saved"))});return}
  case "session":{const c=clone(sess(id));c.agenda=fd.get("agenda");c.results=fd.get("results");c.decisions=fd.get("decisions");saveSession(c);toast(t("saved"));return}
  case "link":{const u=(fd.get("u")||"").trim();if(!/^https:\/\//.test(u)){toast(t("badUrl"));return}const type=f.dataset.type,lab=fd.get("l");
    if(type==="song")songOp(id,"addLink",{label:lab,url:u});
    else if(type==="task"){const c=clone(task(id));c.links=(c.links||[]).concat([{l:lab,u}]);saveTask(c)}
    else{const c=clone(sess(id));c.links=(c.links||[]).concat([{l:lab,u}]);saveSession(c)}
    return}
  case "invoice":{const up=fd.get("upload");saveInvoice({id:"r"+Date.now(),vendor:fd.get("vendor"),nr:fd.get("nr"),date:fd.get("date"),amount:Number(fd.get("amount")),items:fd.get("items"),song:fd.get("song"),status:"paid",file:fd.get("file")||""},up&&up.size?up:null);return}
  case "idea":{run(async()=>{D.ideas.unshift(await api("addIdea",{title:fd.get("title"),text:fd.get("text"),memo:fd.get("memo")||""}));toast(t("saved"))});return}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
